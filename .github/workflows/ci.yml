name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Run browser-side tests
        run: node --test "tests/*.mjs"

  browser:
    # Real Chrome against offline fixture pages. Windows matches the supported
    # desktop setup, including its encrypted login-state store.
    runs-on: windows-latest
    # The full suite plus real-Chrome tests takes over 30 minutes on the hosted runner.
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the suite including real-Chrome tests
        env:
          JOB_AGENT_BROWSER_TESTS: "1"
        run: python -m pytest -q
