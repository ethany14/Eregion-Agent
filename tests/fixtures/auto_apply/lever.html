<!doctype html><html><head><meta charset="utf-8"><title>Example role · fixture</title></head><body>
<h1>Example engineer</h1><form class="application-form">
  <div class="application-question required"><label class="application-label" for="name">Full name ✱</label><input id="name" name="name" required></div>
  <div class="application-question required"><label class="application-label" for="email">Email</label><input id="email" name="email" type="email" required></div>
  <div class="application-question required"><label class="application-label" for="resume">Resume</label><input id="resume" name="resume" type="file" required></div>
  <fieldset><legend>Are you authorized to work in this country?</legend><label><input type="radio" name="authorization" value="yes" required>Yes</label><label><input type="radio" name="authorization" value="no">No</label></fieldset>
  <label><input type="checkbox" name="consent" required>I agree to the data processing policy</label>
  <label>Website<input name="website" type="url"></label>
  <button type="submit">Submit application</button>
</form><script>
window.submissions=0;
document.querySelector('form').addEventListener('submit', e => {
 e.preventDefault(); window.submissions++;
 document.querySelector('form').hidden=true;
 const result=document.createElement('div');result.className='application-confirmation';
 result.textContent='Your application has been submitted. Thank you for applying.';document.body.append(result);
});
</script></body></html>
