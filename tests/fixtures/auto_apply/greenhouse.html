<!doctype html><html><head><meta charset="utf-8"><title>Example role · fixture</title></head><body>
<h1>Example engineer</h1><p>This is an offline application test fixture.</p>
<form id="application">
  <label for="first_name">First Name *</label><input id="first_name" name="first_name" required>
  <label for="last_name">Last Name *</label><input id="last_name" name="last_name" required>
  <label for="email">Email *</label><input id="email" name="email" type="email" required>
  <label for="resume">Resume/CV *</label><input id="resume" name="resume" type="file" required>
  <label for="sponsorship">Do you require sponsorship? *</label><select id="sponsorship" name="sponsorship" required><option value="">Select...</option><option value="yes">Yes</option><option value="no">No</option></select>
  <input type="hidden" name="internal_token" value="not-a-question">
  <button type="submit">Submit Application</button>
</form>
<script>
window.submissions = 0;
document.querySelector('form').addEventListener('submit', e => {
 e.preventDefault(); window.submissions++;
 document.querySelector('form').hidden=true;
 const confirmation=document.createElement('div'); confirmation.id='application_confirmation';
 confirmation.textContent='Thank you for applying. Your application has been received.';
 document.body.append(confirmation);
});
</script></body></html>
