<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eregion Lens</title>
<script src="shared/theme.js"></script>
<link rel="stylesheet" href="shared/tokens.css">
<link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-holly" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 17C13.6 14.8 10.6 15 9.6 12.8 7.6 13.4 6 11.6 4.4 12.4 5.6 9.8 3.8 8.2 5 6.6 7 7.4 8.4 5.4 10.6 6.6 11 4.4 13.4 4 14.6 5.4 14 8 16.2 9.6 15.6 12.2 16.8 14.2 15 17Z"/><path d="M15 17 7 8.6"/><path d="M17 17c2.2-1.2 2.4-4.2 4.6-5-.4-2 1.4-3.4.8-5 2.4 1.4 4.2-.2 5.6 1.2-.8 1.9 1.2 3.4 0 5.4 2 .6 2.2 3 .8 4-2.4-.8-4.2 1.2-6.6.4-1.8 1.2-3.6-.2-5.2-1z"/><path d="M17 17l8.6-7"/></g><circle cx="13.2" cy="22" r="2.3" fill="currentColor"/><circle cx="18.2" cy="22.6" r="2.3" fill="currentColor"/><circle cx="15.8" cy="26.6" r="2.3" fill="currentColor"/></symbol>
    <symbol id="i-ithil" viewBox="0 0 24 24"><path d="M15.5 4.2A8 8 0 1 0 19.8 15 6.6 6.6 0 0 1 15.5 4.2Z"/><path d="M18.5 3.5v3M17 5h3" stroke-width="1.3"/></symbol>
    <symbol id="i-anor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M18.5 5.5l-1.7 1.7M7.2 16.8l-1.7 1.7"/></symbol>
  </svg>
  <main class="panel-shell">
    <header class="panel-header">
      <div class="brand">
        <svg class="mark" aria-hidden="true"><use href="#i-holly"/></svg>
        <div><strong>EREGION</strong><small>Lens</small></div>
      </div>
      <i id="health-dot" title="Backend status"></i>
      <div class="theme-toggle" role="group" aria-label="Theme">
        <span class="thumb"></span>
        <button class="night" type="button" aria-pressed="true" aria-label="Night theme" title="Night (Ithil)"><svg aria-hidden="true"><use href="#i-ithil"/></svg></button>
        <button class="day" type="button" aria-pressed="false" aria-label="Day theme" title="Day (Anor)"><svg aria-hidden="true"><use href="#i-anor"/></svg></button>
      </div>
    </header>

    <section class="input-card" aria-labelledby="detected-title">
      <div class="section-title">
        <h1 id="detected-title">Sighted on this page</h1>
        <button id="extract-button" class="ghost-button" type="button">Extract page</button>
      </div>
      <div class="meta-grid">
        <label>Role<input id="job-title" maxlength="256" placeholder="Job title"></label>
        <label>Company<input id="job-company" maxlength="256" placeholder="Company"></label>
      </div>
      <label class="full-field">Description<textarea id="job-description" maxlength="50000" rows="7" placeholder="Extract the current page or paste a job description"></textarea></label>
      <p id="extract-note" class="note">Nothing is sent until you select Analyze or Save.</p>
    </section>

    <div class="primary-actions">
      <button id="analyze-button" class="analyze-button" type="button"><span id="analyze-label">Analyze fit</span><b aria-hidden="true">→</b></button>
      <button id="save-job-button" class="ghost-button" type="button">Save to the Road</button>
    </div>
    <div id="message" class="message" role="status" hidden></div>

    <section id="result" class="result" hidden aria-labelledby="result-title">
      <div class="result-head">
        <div class="score-ring" id="score-ring"><strong id="match-score">0%</strong><span>fit</span></div>
        <div><h2 id="result-title">Your fit</h2><p id="result-status"></p></div>
      </div>
      <p class="requirement-grid">
        <span><strong id="matched-count">0</strong> matched</span>
        <span><strong id="partial-count">0</strong> partial</span>
        <span><strong id="missing-count">0</strong> missing</span>
      </p>
      <div class="set-out">
        <p class="eyebrow">If you set out</p>
        <ol class="trail"><li class="st now"><i></i><span>Sighted</span></li><li class="st"><i></i><span>Prepared</span></li><li class="st"><i></i><span>Sent</span></li></ol>
      </div>
      <div class="suggestions"><p class="eyebrow">What to do next</p><ol id="suggestion-list"></ol></div>
      <details><summary>Requirement details</summary><div id="requirement-details"></div></details>
    </section>

    <footer>
      <button id="open-web-button" class="web-button" type="button">Set out with Eregion <span aria-hidden="true">↗</span></button>
      <button id="open-application-button" class="web-button" type="button" hidden>Open this saved job <span aria-hidden="true">↗</span></button>
      <small>Your resume stays on this computer.</small>
    </footer>
  </main>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
